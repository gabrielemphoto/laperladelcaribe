<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="logoWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(10, 5)">
    <!-- Outer Shell / Wave Crest -->
    <circle cx="30" cy="30" r="28" fill="#091426" stroke="url(#logoWave)" stroke-width="2"/>
    <path d="M14 36 C18 20, 42 20, 46 36 C42 42, 18 42, 14 36 Z" stroke="url(#logoGold)" stroke-width="1.8" fill="none"/>
    <!-- Pearl -->
    <circle cx="30" cy="31" r="7" fill="#ffffff" filter="drop-shadow(0 2px 5px rgba(255,255,255,0.4))"/>
    <circle cx="32" cy="29" r="2" fill="#f0f9ff"/>
    <!-- Subtle Star Accent -->
    <path d="M30 11 L31 15 L35 16 L31 17 L30 21 L29 17 L25 16 L29 15 Z" fill="url(#logoGold)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 24)">
    <text x="0" y="8" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="2.5" fill="#f8fafc">
      LA PERLA
    </text>
    <text x="105" y="8" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="300" letter-spacing="2.5" fill="url(#logoGold)">
      DEL CARIBE
    </text>
    <text x="1" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="4.2" fill="#94a3b8">
      INVERSIONES &amp; REAL ESTATE &bull; MARGARITA
    </text>
  </g>
</svg>
