<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" fill="none" class="margarita-island-map">
  <defs>
    <!-- Gradients -->
    <linearGradient id="islandOceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGlowPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Grid -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(212, 160, 23, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="900" height="480" fill="url(#gridPattern)" rx="16"/>

  <!-- Compass Rose -->
  <g transform="translate(820, 60)" opacity="0.65">
    <circle cx="0" cy="0" r="28" stroke="rgba(212, 160, 23, 0.3)" stroke-width="1" fill="none"/>
    <path d="M 0 -22 L 5 -5 L 0 0 L -5 -5 Z" fill="#d4a017"/>
    <path d="M 0 22 L 5 5 L 0 0 L -5 5 Z" fill="#64748b"/>
    <path d="M 22 0 L 5 5 L 0 0 L 5 -5 Z" fill="#64748b"/>
    <path d="M -22 0 L -5 5 L 0 0 L -5 -5 Z" fill="#64748b"/>
    <text x="0" y="-26" text-anchor="middle" fill="#d4a017" font-size="11" font-weight="700" font-family="'Montserrat', sans-serif">N</text>
  </g>

  <!-- Title / Legend watermark -->
  <text x="40" y="440" fill="rgba(248, 233, 201, 0.25)" font-family="'Playfair Display', serif" font-size="28" font-weight="700">
    ISLA DE MARGARITA
  </text>
  <text x="42" y="460" fill="rgba(212, 160, 23, 0.4)" font-family="'Montserrat', sans-serif" font-size="11" letter-spacing="3">
    MAPA ESTRATÉGICO DE OPORTUNIDADES &bull; NUEVA ESPARTA
  </text>

  <!-- Island Landmass Shapes -->
  <!-- 1. Península de Macanao (West) -->
  <path class="island-path macanao-land" 
        d="M 120 220 
           C 140 190, 190 180, 260 200 
           C 310 215, 340 230, 360 250 
           C 350 280, 310 300, 250 310 
           C 180 320, 130 300, 100 280 
           C 80 260, 95 235, 120 220 Z" 
        fill="url(#landGrad)" 
        stroke="rgba(212, 160, 23, 0.4)" 
        stroke-width="2"/>

  <!-- 2. Istmo de La Restinga (Laguna) -->
  <path class="island-path restinga-isthmus" 
        d="M 350 245 
           Q 430 240 500 230 
           Q 510 255 460 260 
           Q 390 265 350 255 Z" 
        fill="url(#landGrad)" 
        stroke="rgba(212, 160, 23, 0.35)" 
        stroke-width="1.8"/>

  <!-- 3. Península Oriental (Main Island: Pampatar, Porlamar, El Yaque, El Agua) -->
  <path class="island-path east-land" 
        d="M 500 225 
           C 510 170, 560 130, 640 110 
           C 710 90, 770 115, 785 160 
           C 800 200, 810 250, 790 290 
           C 770 330, 720 350, 660 355 
           C 590 360, 540 330, 520 295 
           C 490 280, 480 250, 500 225 Z" 
        fill="url(#landGrad)" 
        stroke="rgba(212, 160, 23, 0.5)" 
        stroke-width="2" 
        filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>

  <!-- Mountainous / Topography Relief lines (Artistic aesthetic) -->
  <path d="M 620 150 Q 670 130 730 160 Q 690 190 640 180 Z" fill="rgba(212, 160, 23, 0.06)" stroke="rgba(212, 160, 23, 0.15)"/>
  <path d="M 640 210 Q 700 190 750 230 Q 710 260 650 240 Z" fill="rgba(212, 160, 23, 0.06)" stroke="rgba(212, 160, 23, 0.15)"/>
  <path d="M 180 240 Q 240 220 290 250 Q 250 280 200 270 Z" fill="rgba(212, 160, 23, 0.05)" stroke="rgba(212, 160, 23, 0.12)"/>

  <!-- Ocean Waves & Currents Lines -->
  <path d="M 50 160 Q 150 140 250 160" stroke="rgba(56, 189, 248, 0.12)" stroke-dasharray="4 6"/>
  <path d="M 520 80 Q 650 60 780 75" stroke="rgba(56, 189, 248, 0.12)" stroke-dasharray="4 6"/>
  <path d="M 560 390 Q 680 410 820 380" stroke="rgba(56, 189, 248, 0.12)" stroke-dasharray="4 6"/>

  <!-- ================= HOTSPOT PINS (Clickable & Interactive) ================= -->

  <!-- PIN 1: PAMPATAR & PLAYA MORENO (Epicentro Inmobiliario y Gastronómico) -->
  <g class="map-pin-group" data-zone="pampatar" transform="translate(760, 260)" cursor="pointer">
    <circle cx="0" cy="0" r="22" fill="rgba(212, 160, 23, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="10" fill="url(#goldGlowPin)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="15" y="-18" width="125" height="36" rx="8" fill="rgba(11, 11, 11, 0.9)" stroke="#d4a017" stroke-width="1.2"/>
    <text x="25" y="-2" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">PAMPATAR</text>
    <text x="25" y="11" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="8.5">Milla de Oro &bull; 4 Activos</text>
  </g>

  <!-- PIN 2: PLAYA EL YAQUE (Epicentro Kitesurf & Posadas Boutique) -->
  <g class="map-pin-group" data-zone="el-yaque" transform="translate(560, 320)" cursor="pointer">
    <circle cx="0" cy="0" r="20" fill="rgba(255, 138, 0, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="9" fill="#ff8a00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3.5" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="-140" y="-14" width="125" height="36" rx="8" fill="rgba(11, 11, 11, 0.9)" stroke="#ff8a00" stroke-width="1.2"/>
    <text x="-130" y="2" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">PLAYA EL YAQUE</text>
    <text x="-130" y="15" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="8.5">Posadas &bull; 3 Activos</text>
  </g>

  <!-- PIN 3: COSTA AZUL / PORLAMAR (Hub Financiero & Penthouses) -->
  <g class="map-pin-group" data-zone="costa-azul" transform="translate(710, 310)" cursor="pointer">
    <circle cx="0" cy="0" r="18" fill="rgba(56, 189, 248, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="14" y="-14" width="125" height="36" rx="8" fill="rgba(11, 11, 11, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="24" y="2" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">COSTA AZUL</text>
    <text x="24" y="15" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="8.5">Residencial &bull; 3 Activos</text>
  </g>

  <!-- PIN 4: PLAYA EL AGUA / MANZANILLO (Grandes Terrenos & Resorts) -->
  <g class="map-pin-group" data-zone="playa-el-agua" transform="translate(740, 130)" cursor="pointer">
    <circle cx="0" cy="0" r="20" fill="rgba(212, 160, 23, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="9" fill="url(#goldGlowPin)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3.5" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="15" y="-18" width="135" height="36" rx="8" fill="rgba(11, 11, 11, 0.9)" stroke="#d4a017" stroke-width="1.2"/>
    <text x="25" y="-2" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700">PLAYA EL AGUA</text>
    <text x="25" y="11" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="8.5">Mega Terrenos &bull; 2 Activos</text>
  </g>

  <!-- PIN 5: LA CARANTA / BAHÍA (Villas frente al Acantilado) -->
  <g class="map-pin-group" data-zone="la-caranta" transform="translate(790, 230)" cursor="pointer">
    <circle cx="0" cy="0" r="16" fill="rgba(255, 138, 0, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="7.5" fill="#ff8a00" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="-135" y="-16" width="120" height="32" rx="6" fill="rgba(11, 11, 11, 0.9)" stroke="#ff8a00" stroke-width="1"/>
    <text x="-125" y="-1" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">LA CARANTA</text>
    <text x="-125" y="10" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="7.5">Villas de Acantilado</text>
  </g>

  <!-- PIN 6: PENÍNSULA DE MACANAO (Ecoturismo & Gran Escala) -->
  <g class="map-pin-group" data-zone="macanao" transform="translate(220, 260)" cursor="pointer">
    <circle cx="0" cy="0" r="18" fill="rgba(56, 189, 248, 0.2)" class="pin-pulse"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#0b0b0b"/>
    <!-- Label -->
    <rect x="-140" y="-16" width="125" height="34" rx="6" fill="rgba(11, 11, 11, 0.9)" stroke="#38bdf8" stroke-width="1"/>
    <text x="-130" y="-1" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700">MACANAO</text>
    <text x="-130" y="11" fill="#f8e9c9" font-family="'Montserrat', sans-serif" font-size="7.5">Ecoturismo &bull; 2 Lotes</text>
  </g>
</svg>
