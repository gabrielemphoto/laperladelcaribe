<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modelo 3D Interactivo • La Perla del Caribe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Contenedor 3D WebGL con Fondo 100% Transparente -->
  <div id="canvas-container"></div>

  <!-- Flecha de Navegación Izquierda (Proyecto Anterior) -->
  <button class="nav-arrow nav-arrow-left" id="btn-arrow-prev" aria-label="Proyecto Anterior" title="Proyecto Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- Flecha de Navegación Derecha (Proyecto Siguiente) -->
  <button class="nav-arrow nav-arrow-right" id="btn-arrow-next" aria-label="Proyecto Siguiente" title="Proyecto Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Píldora Minimalista del Proyecto Activo -->
  <div class="project-pill-badge" id="project-pill">
    <span class="pill-dot"></span>
    <div class="pill-text-col">
      <span class="pill-title" id="project-badge-text">PROYECTO 1 • TERRENO A CONSTRUCCIÓN</span>
      <span class="pill-sub" id="project-badge-sub">Lote Virgen ➔ Cabaña Modular Autosuficiente</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
